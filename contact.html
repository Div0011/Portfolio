<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
//custom cursor
 document.addEventListener("DOMContentLoaded", ()=>{
   
  let cursorItem = document.querySelector(".cursor")
  let cursorParagraph = cursorItem.querySelector("p")
  let targets = document.querySelectorAll("[data-cursor]")
  let xOffset = 6;
  let yOffset = 140;
  let cursorIsOnRight = false;
  let currentTarget = null;
  let lastText = '';
  
  // Position cursor relative to actual cursor position on page load
  gsap.set(cursorItem, {xPercent: xOffset, yPercent: yOffset});

  // Use GSAP quick.to for a more performative tween on the cursor
  let xTo = gsap.quickTo(cursorItem, "x", { ease: "power3"});
  let yTo = gsap.quickTo(cursorItem, "y", { ease: "power3"});

  // On mousemove, call the quickTo functions to the actual cursor position
  window.addEventListener("mousemove", e => {
    let windowWidth = window.innerWidth;
    let windowHeight = window.innerHeight;
    let scrollY = window.scrollY;
    let cursorX = e.clientX;
    let cursorY = e.clientY + scrollY; // Adjust cursorY to account for scroll

    // Default offsets
    let xPercent = xOffset;
    let yPercent = yOffset;

    // Adjust X offset if in the rightmost 19% of the window
    if (cursorX > windowWidth * 0.9) {
      cursorIsOnRight = true;
      xPercent = -100;
    } else{
      cursorIsOnRight = false;
    }

    // Adjust Y offset if in the bottom 10% of the current viewport
    if (cursorY > scrollY + windowHeight * 0.9) {
      yPercent = -120; 
    }
    
    if (currentTarget) {
      let newText = currentTarget.getAttribute("data-cursor");
      if (currentTarget.hasAttribute("data-easteregg") && cursorIsOnRight) {
        newText = currentTarget.getAttribute("data-easteregg");
      }

      if (newText !== lastText) { // Only update if the text is different
        cursorParagraph.innerHTML = newText;
        lastText = newText;
      }
    }

    gsap.to(cursorItem, { xPercent: xPercent, yPercent: yPercent, duration: 0.9, ease: "power3" });
    xTo(cursorX);
    yTo(cursorY - scrollY); // Subtract scroll for viewport positioning
  });

  
  // Add a mouse enter listener for each link that has a data-cursor attribute
  targets.forEach(target => {
    target.addEventListener("mouseenter", () => {
      currentTarget = target; // Set the current target
      
      // If element has data-easteregg attribute, load different text
      let newText = target.hasAttribute("data-easteregg")
        ? target.getAttribute("data-easteregg")
        : target.getAttribute("data-cursor");

			// Update only if the text changes
      if (newText !== lastText) {
        cursorParagraph.innerHTML = newText;
        lastText = newText;
      }
    });
  });
  
 })

<script>
function initImageTrail(config = {}) {
  gsap.registerPlugin(ScrollTrigger);

  // config + defaults
  const options = {
    minWidth: config.minWidth ?? 992,
    moveDistance: config.moveDistance ?? 12,
    stopDuration: config.stopDuration ?? 300,
    trailLength: config.trailLength ?? 8
  };

  const wrapper = document.querySelector('[data-trail="wrapper"]');
  
  if (!wrapper || window.innerWidth < options.minWidth) {
    return;
  }
  
  // State management
  const state = {
    trailInterval: null,
    globalIndex: 0,
    last: { x: 0, y: 0 },
    trailImageTimestamps: new Map(),
    trailImages: Array.from(document.querySelectorAll('[data-trail="item"]')),
    isActive: false
  };

  // Utility functions
  const MathUtils = {
    lerp: (a, b, n) => (1 - n) * a + n * b,
    distance: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1)
  };

  function getRelativeCoordinates(e, rect) {
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  function activate(trailImage, x, y) {
    if (!trailImage) return;

    const rect = trailImage.getBoundingClientRect();
    const styles = {
      left: `${x - rect.width / 2}px`,
      top: `${y - rect.height / 2}px`,
      zIndex: state.globalIndex,
      display: 'block'
    };

    Object.assign(trailImage.style, styles);
    state.trailImageTimestamps.set(trailImage, Date.now());

gsap.fromTo(
      trailImage,
      { autoAlpha: 0, scale: 0.8, y: 0 },
      {
        scale: 1,
        autoAlpha: 1,
        duration: 0.2,
        overwrite: true
      }
    );

    state.last = { x, y };
  }


  function fadeOutTrailImage(trailImage) {
    if (!trailImage) return;

    // Animation pour faire tomber l'image vers le bas avec opacité qui diminue
    gsap.to(trailImage, {
    
      opacity: 0,
      y: "+=400", // L'image descend de 400 pixels
      duration: 1,
      delay: 0.5,
      ease: "power3.out",
      onComplete: () => {
        gsap.set(trailImage, { autoAlpha: 0 });
      }
    });
  }

  function handleOnMove(e) {
    if (!state.isActive) return;

    const rectWrapper = wrapper.getBoundingClientRect();
    const { x: relativeX, y: relativeY } = getRelativeCoordinates(e, rectWrapper);
    
    const distanceFromLast = MathUtils.distance(
      relativeX, 
      relativeY, 
      state.last.x, 
      state.last.y
    );

    if (distanceFromLast > window.innerWidth / options.moveDistance) {
      const lead = state.trailImages[state.globalIndex % state.trailImages.length];
      const tail = state.trailImages[(state.globalIndex - options.trailLength) % state.trailImages.length];

      activate(lead, relativeX, relativeY);
      fadeOutTrailImage(tail);
      state.globalIndex++;
    }
  }

  function cleanupTrailImages() {
    const currentTime = Date.now();
    for (const [trailImage, timestamp] of state.trailImageTimestamps.entries()) {
      if (currentTime - timestamp > options.stopDuration) {
        fadeOutTrailImage(trailImage);
        state.trailImageTimestamps.delete(trailImage);
      }
    }
  }

  function startTrail() {
    if (state.isActive) return;
    
    state.isActive = true;
    wrapper.addEventListener("mousemove", handleOnMove);
    state.trailInterval = setInterval(cleanupTrailImages, 100);
  }

  function stopTrail() {
    if (!state.isActive) return;
    
    state.isActive = false;
    wrapper.removeEventListener("mousemove", handleOnMove);
    clearInterval(state.trailInterval);
    state.trailInterval = null;
    
    // Clean up remaining trail images
    state.trailImages.forEach(fadeOutTrailImage);
    state.trailImageTimestamps.clear();
  }

  
  ScrollTrigger.create({
  trigger: document.body,
  start: "bottom bottom",
  onEnter: startTrail, // Déclenche l'animation quand on atteint le bas
});


  // Clean up on window resize
  const handleResize = () => {
    if (window.innerWidth < options.minWidth && state.isActive) {
      stopTrail();
    } else if (window.innerWidth >= options.minWidth && !state.isActive) {
      startTrail();
    }
  };

  window.addEventListener('resize', handleResize);

  // Démarrer immédiatement si la largeur d'écran est suffisante
  if (window.innerWidth >= options.minWidth) {
    startTrail();
  }

  return () => {
    stopTrail();
    window.removeEventListener('resize', handleResize);
  };
}

document.addEventListener("DOMContentLoaded", () => {
  const imageTrail = initImageTrail({
    minWidth: 992,
    moveDistance: 12,
    stopDuration: 300,
    trailLength: 8
  });
});
</script>

  let lastSpawn = 0;

        if (activeTextSticker) {
          fadeAndRemove(activeTextSticker);
          activeTextSticker = null;
        }
        return;
      }

      // If we have an active sticker, check how far the cursor moved
      if (activeTextSticker) {
        const dist = Math.hypot(e.clientX - activeTextStickerPos.x, e.clientY - activeTextStickerPos.y);

        if (dist < 100) {
          return;
        }
        // Fade and scale out the current one smoothly
        fadeAndRemove(activeTextSticker);
        activeTextSticker = null;
      }

      // Spawn the next sticker
      const img = document.createElement('img');
      img.src = stickers[Math.floor(Math.random() * stickers.length)];
      img.className = 'sticker-trail-item';
      img.style.left = e.clientX + 'px';
      img.style.top = e.clientY + 'px';
      const rot = Math.random() * 60 - 30;
      img.style.setProperty('--rot', `rotate(${rot}deg)`);

      // Force a reflow and activate transition
      img.offsetWidth;
      img.classList.add('active');

      activeTextSticker = img;
      activeTextStickerPos = { x: e.clientX, y: e.clientY };

      // Set a safety timeout to fade it out if the user stops moving for 2.5 seconds
      if (activeTextTimeout) clearTimeout(activeTextTimeout);
      activeTextTimeout = setTimeout(() => {
        if (activeTextSticker === img) {
          fadeAndRemove(img);
          activeTextSticker = null;
        }
      }, 2500);
    });
  }

  function fadeAndRemove(element) {
    if (!element) return;
    element.classList.remove('active');
    element.classList.add('fade-out-active');
    setTimeout(() => {
      element.remove();
    }, 550);
  }
});
</script>
